<script>
    function generatePublicationsMenu() {
    const currentYear = new Date().getFullYear();
    const startYear = 2019;
    const years = [];

    for (let year = currentYear; year >= startYear; year--) {
        years.push(year);
    }

    const subsequentGroupItems = 4;
    let groups = [];
    let remainingYears = [...years];

    const firstGroupYears = remainingYears.splice(0, subsequentGroupItems);
    if (firstGroupYears.length > 0 || currentYear >= startYear) {
        groups.push(firstGroupYears);
    }

    while (remainingYears.length > 0) {
        groups.push(remainingYears.splice(0, subsequentGroupItems));
    }

    const ulMegaMenu = document.createElement('ul');
    ulMegaMenu.className = 'row megamenu';

    groups.forEach((yearGroup, groupIndex) => {
        if (yearGroup.length === 0) return;

        const liColumn = document.createElement('li');
        liColumn.className = 'col-lg-3';

        const start = yearGroup[0];
        const end = yearGroup[yearGroup.length - 1];
        const subTitleText = `${start} - ${end < startYear ? startYear : end}`;

        const spanTitle = document.createElement('span');
        spanTitle.className = 'mb-lg-2 d-block py-2 px-4 p-lg-0 small text-uppercase sub-title';
        spanTitle.textContent = subTitleText;

        const ulList = document.createElement('ul');

        if (groupIndex === 0) {
            const liAll = document.createElement('li');
            const aAll = document.createElement('a');
            aAll.href = '../../publications/index.html';
            aAll.textContent = 'All';
            liAll.appendChild(aAll);
            ulList.appendChild(liAll);
        }

        yearGroup.forEach(year => {
            const liYear = document.createElement('li');
            const aYear = document.createElement('a');
            aYear.href = `/publications/${year}/`;
            aYear.textContent = year.toString();
            liYear.appendChild(aYear);
            ulList.appendChild(liYear);
        });

        liColumn.appendChild(spanTitle);
        liColumn.appendChild(ulList);
        ulMegaMenu.appendChild(liColumn);
    });

    const container = document.getElementById('publications-menu-container');
    if (container) {
        container.innerHTML = '';
        container.appendChild(ulMegaMenu);
    } else {
        console.error("Target container with ID 'publications-menu-container' not found.");
    }
}
</script>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const superscriptX = 'ˣ';
            const replacement = `E${superscriptX}PERT`;

            // Create a TreeWalker to traverse all text nodes in the document body
            const walker = document.createTreeWalker(
                document.body,
                NodeFilter.SHOW_TEXT,
                null,
                false
            );

            const textNodes = [];
            let node;
            while (node = walker.nextNode()) {
                textNodes.push(node);
            }
            const regex = /\bExpert\b/gi;

            textNodes.forEach(textNode => {
                const parent = textNode.parentNode;
                const text = textNode.nodeValue;

                if (regex.test(text)) {
                    const replacedText = text.replace(regex, replacement);

                    if (text !== replacedText) {
                        const newNode = document.createTextNode(replacedText);
                        parent.insertBefore(newNode, textNode);
                        parent.removeChild(textNode);
                    }
                }
            });

        });
    </script>
